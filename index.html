<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf8f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1f1d1b" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/routina-weave/favicon.svg" />
    <title>Routina Weave</title>
    <script>
      // 在 React 載入前就決定深淺色，避免先閃一下白底
      try {
        var t = localStorage.getItem('weave-theme')
        var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
